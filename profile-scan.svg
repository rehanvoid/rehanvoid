<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#03110f"/><stop offset=".55" stop-color="#041b17"/><stop offset="1" stop-color="#020907"/></linearGradient>
 <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7dffe2"/><stop offset=".45" stop-color="#00d9a5"/><stop offset="1" stop-color="#3bffcb"/></linearGradient>
 <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#08221c"/><stop offset="1" stop-color="#04120f"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="soft"><feGaussianBlur stdDeviation="1.6"/></filter>
 <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse"><path d="M22 0H0V22" fill="none" stroke="#0b4a3d" stroke-width=".7" opacity=".55"/></pattern>
 <pattern id="scanlines" width="4" height="8" patternUnits="userSpaceOnUse"><path d="M0 7.5H4" stroke="#a0ffe8" stroke-width=".5" opacity=".12"/></pattern>
 <clipPath id="clipFace"><rect x="54" y="145" width="515" height="440" rx="12"/></clipPath>
</defs>
<!-- Outer terminal shell -->
<rect x="8" y="8" width="1184" height="634" rx="24" fill="#010605" stroke="#145b4a" stroke-width="2"/>
<rect x="18" y="18" width="1164" height="614" rx="18" fill="url(#bg)" stroke="url(#edge)" stroke-width="2"/>
<rect x="18" y="18" width="1164" height="54" rx="18" fill="#09201a"/>
<path d="M18 72H1182" stroke="#53ffd7" stroke-width="1.5" opacity=".8"/>
<circle cx="43" cy="45" r="6" fill="#59ffd4"/><circle cx="64" cy="45" r="6" fill="#24cda3"/><circle cx="85" cy="45" r="6" fill="#16866e"/>
<text x="600" y="50" fill="#a6ffe9" font-family="monospace" font-size="17" text-anchor="middle" letter-spacing="4">REHANVOID // PROFILE SCANNER</text>
<text x="1138" y="49" fill="#54eec8" font-family="monospace" font-size="12" text-anchor="end">SYS v.01</text>
<!-- left face panel -->
<rect x="38" y="92" width="548" height="518" rx="15" fill="url(#panel)" stroke="#39edbf" stroke-width="1.8"/>
<rect x="38" y="92" width="548" height="518" rx="15" fill="url(#grid)" opacity=".8"/>
<text x="62" y="124" fill="#78ffdf" font-family="monospace" font-size="14" letter-spacing="2">01 / DIGITAL ENTITY</text>
<text x="558" y="124" fill="#42dcb5" font-family="monospace" font-size="11" text-anchor="end">FACIAL MATRIX: ACTIVE</text>
<!-- face frame -->
<g stroke="#38e9bc" fill="none" opacity=".8">
 <path d="M155 176H468L500 211V489L468 524H155L123 489V211Z" stroke-width="1.5"/>
 <path d="M175 194H448L480 226V474L448 506H175L143 474V226Z" stroke-dasharray="3 7" opacity=".65"/>
 <path d="M108 270H142M108 286H132M482 270H516M492 286H516M108 414H142M108 430H132M482 414H516M492 430H516" stroke-width="2"/>
</g>
<!-- digital face silhouette -->
<g filter="url(#glow)" stroke="#75ffe0" stroke-width="2.2" fill="none" stroke-linejoin="round">
 <path d="M236 226 Q294 184 352 226 L393 272 L405 350 L385 425 L348 463 L240 463 L203 425 L183 350 L195 272 Z" fill="#06231c" fill-opacity=".65"/>
 <path d="M223 252 L246 231 L273 222 M365 252 L342 231 L315 222" opacity=".8"/>
 <path d="M218 296 L269 287 L283 311 L269 330 L218 321 Z" fill="#0b3b30"/>
 <path d="M319 311 L333 287 L384 296 L384 321 L333 330 Z" fill="#0b3b30"/>
 <path d="M233 307 L267 307 M335 307 L369 307" stroke-width="5"/>
 <path d="M301 319 L286 366 L309 371" stroke-width="3"/>
 <path d="M260 397 Q300 414 342 397 L330 420 L272 420 Z" fill="#0a3329"/>
 <path d="M272 407H330" stroke-width="2"/>
 <path d="M244 440 L260 455 H340 L356 440" opacity=".7"/>
</g>
<!-- decorative digital glyph rows -->
<g fill="#43f2c4" font-family="monospace" font-size="10" opacity=".68">
 <text x="70" y="166">01001010 10110010</text><text x="70" y="550">11001001 01010110</text>
 <text x="420" y="166">0x7F // ID</text><text x="425" y="550">SCAN_OK</text>
 <text x="70" y="570">ENTITY_RENDER: 98.7%</text><text x="420" y="570">SYNCED</text>
</g>
<!-- animated scan beam -->
<rect x="52" y="150" width="520" height="3" rx="2" fill="#9affeb" opacity=".9" filter="url(#glow)">
 <animate attributeName="y" values="150;580;150" dur="5s" repeatCount="indefinite"/>
</rect>
<rect x="52" y="145" width="520" height="440" rx="12" fill="url(#scanlines)" clip-path="url(#clipFace)" opacity=".7"/>
<text x="312" y="598" fill="#8affdf" font-family="monospace" font-size="12" text-anchor="middle" letter-spacing="2">DIGITAL ENTITY // ONLINE</text>
<!-- right profile panel -->
<rect x="610" y="92" width="552" height="518" rx="15" fill="url(#panel)" stroke="#39edbf" stroke-width="1.8"/>
<rect x="610" y="92" width="552" height="518" rx="15" fill="url(#grid)" opacity=".55"/>
<text x="636" y="124" fill="#78ffdf" font-family="monospace" font-size="14" letter-spacing="2">02 / PROFILE DATA</text>
<text x="1138" y="124" fill="#42dcb5" font-family="monospace" font-size="11" text-anchor="end">READ-ONLY</text>
<!-- data rows -->
<g font-family="monospace" font-size="16">
 <g fill="#54dcb8"><text x="640" y="174">USERNAME</text><text x="640" y="224">ALIAS</text><text x="640" y="274">STATUS</text><text x="640" y="324">FOCUS</text><text x="640" y="374">STACK</text><text x="640" y="424">MISSION</text><text x="640" y="474">CONTACT</text></g>
 <g fill="#d6fff4"><text x="805" y="174">rehanvoid</text><text x="805" y="224">Rehan</text><text x="805" y="274">LEARNING / ONLINE</text><text x="805" y="324">Cybersecurity + Software Dev</text><text x="805" y="374">Python · C++ · Linux</text><text x="805" y="397">HTML · SQL</text><text x="805" y="424">Build. Secure. Improve.</text><text x="805" y="474">github.com/rehanvoid</text></g>
 <g stroke="#176452" stroke-width="1"><path d="M640 190H1135M640 240H1135M640 290H1135M640 340H1135M640 410H1135M640 440H1135M640 490H1135"/></g>
</g>
<!-- progress bars -->
<text x="640" y="530" fill="#72fbd8" font-family="monospace" font-size="12">SYSTEM STATUS</text>
<rect x="640" y="545" width="495" height="12" rx="6" fill="#0b3028" stroke="#1c8067"/>
<rect x="640" y="545" width="410" height="12" rx="6" fill="#39edbf" filter="url(#glow)">
 <animate attributeName="width" values="330;455;410;330" dur="4s" repeatCount="indefinite"/>
</rect>
<text x="640" y="584" fill="#9affeb" font-family="monospace" font-size="12">ACCESS GRANTED</text>
<text x="1135" y="584" fill="#9affeb" font-family="monospace" font-size="12" text-anchor="end">SCAN COMPLETE ✓</text>
<!-- subtle outer glow -->
<rect x="18" y="18" width="1164" height="614" rx="18" fill="none" stroke="#7dffe2" stroke-width="1" opacity=".4" filter="url(#glow)"/>
</svg>